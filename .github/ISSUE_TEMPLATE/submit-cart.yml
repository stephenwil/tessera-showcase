name: Submit a Cartridge
description: Submit your Tessera High-Res cartridge to the Community Showcase & Store
title: "[Cart]: <Game Title> by <Author>"
labels: ["cart-submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎮 Submit Your Cartridge to the Tessera Showcase!
        Thank you for building a 3D voxel game for Tessera High-Res!
        Please fill out this quick form with your cartridge details.

  - type: input
    id: title
    attributes:
      label: Cartridge Title
      placeholder: "e.g., Star Runner 3D"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author Name / Handle
      placeholder: "e.g., Alex / @alex_dev"
    validations:
      required: true

  - type: dropdown
    id: genre
    attributes:
      label: Primary Genre
      options:
        - Adventure
        - Arcade & Racing
        - Strategy & Tactics
        - Puzzle
        - Atmospheric & Diorama
        - Demos & Benchmarks
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Game Description
      description: A brief summary of gameplay, controls, and features.
      placeholder: "Explore the ancient voxel ruins, activate levers, and collect crystals..."
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Search Tags (comma separated)
      placeholder: "dungeon, puzzle, speedrun, synth, 3D"

  - type: textarea
    id: cart_text
    attributes:
      label: Cartridge Code (.tess UTF-8 Text)
      description: Paste your full .tess cartridge content here (starting with 'tessera cart v1').
      render: text
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Verification & Permissions
      options:
        - label: This cartridge is an original work or open-source adaptation created by me.
          required: true
        - label: The cartridge runs smoothly in the standard Tessera web runtime.
          required: true
